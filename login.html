<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | DeskDesign3D</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>

<body>

<header>
    <h1>DeskDesign3D</h1>

    <nav>
        <a href="index.html">Home</a>
    </nav>
</header>

<div class="form-container">
    <!-- Message container for feedback -->
    <div id="messageContainer" aria-live="polite"></div>

    <h2>Login</h2>

    <input
        type="email"
        id="loginEmail"
        placeholder="Email"
        autocomplete="email">

    <input
        type="password"
        id="loginPassword"
        placeholder="Password"
        autocomplete="current-password">

    <button id="loginBtn" onclick="login()">
        Login
    </button>

    <br><br>

    <h2>Create Account</h2>

    <input
        type="email"
        id="registerEmail"
        placeholder="Email"
        autocomplete="email">

    <input
        type="password"
        id="registerPassword"
        placeholder="Password (min 8 characters)"
        autocomplete="new-password">

    <button id="registerBtn" onclick="register()">
        Create Account
    </button>

    <br><br>

    <button id="forgotBtn" onclick="forgotPassword()">
        Forgot Password
    </button>

</div>

<style>
    #messageContainer {
        margin-bottom: 20px;
    }

    .message {
        padding: 12px 16px;
        border-radius: 8px;
        margin-bottom: 15px;
        font-weight: 500;
        animation: slideIn 0.3s ease-out;
    }

    .message-error {
        background: #fee;
        color: #c00;
        border-left: 4px solid #c00;
    }

    .message-success {
        background: #efe;
        color: #060;
        border-left: 4px solid #060;
    }

    .message-info {
        background: #eef;
        color: #006;
        border-left: 4px solid #006;
    }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(-10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }
</style>

<script src="auth.js"></script>

</body>
</html>
