<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Admin Dashboard | DeskDesign3D

</title>

<link
rel="stylesheet"
href="assets/css/main.css">

<link
rel="stylesheet"
href="assets/css/layout.css">

<link
rel="stylesheet"
href="assets/css/admin.css">

<link
rel="stylesheet"
href="assets/css/responsive.css">

</head>

<body data-page="admin">

<main>

<section class="container">

<h1>

Administration

</h1>

<div class="admin-grid">

<aside class="admin-sidebar">

<button

class="admin-tab active"

data-tab="products">

Products

</button>

<button

class="admin-tab"

data-tab="categories">

Categories

</button>

<button

class="admin-tab"

data-tab="orders">

Orders

</button>

<button

class="admin-tab"

data-tab="customers">

Customers

</button>

</aside>

<section class="admin-content">

<div
id="productsTab"
class="admin-section">

<h2>

Products

</h2>

<form
id="productForm">

<input
type="hidden"
id="productId">

<div class="form-group">

<label>

Product Name

</label>

<input

type="text"

id="productName"

required>

</div>

<div class="form-group">

<label>

Category

</label>

<select
id="productCategory"
required>

</select>

</div>

<div class="form-group">

<label>

Price

</label>

<input

type="number"

step="0.01"

id="productPrice"

required>

</div>

<div class="form-group">

<label>

Stock

</label>

<input

type="number"

id="productStock"

required>

</div>

<div class="form-group">

<label>

Description

</label>

<textarea

id="productDescription"

rows="6">

</textarea>

</div>

<div class="form-group">

<label>

Product Image

</label>

<input

type="file"

id="productImage"

accept="image/*">

</div>

<button

type="submit"

class="primary-button">

Save Product

</button>

</form>

<hr>

<table class="admin-table">

<thead>

<tr>

<th>

Name

</th>

<th>

Price

</th>

<th>

Stock

</th>

<th>

Actions

</th>

</tr>

</thead>

<tbody
id="productsTable">

</tbody>

</table>

</div>
<div
id="categoriesTab"
class="admin-section hidden">

<h2>

Categories

</h2>

<form id="categoryForm">

<input
type="hidden"
id="categoryId">

<div class="form-group">

<label>

Category Name

</label>

<input
type="text"
id="categoryName"
required>

</div>

<button
type="submit"
class="primary-button">

Save Category

</button>

</form>

<hr>

<table class="admin-table">

<thead>

<tr>

<th>

Name

</th>

<th>

Actions

</th>

</tr>

</thead>

<tbody id="categoriesTable">

</tbody>

</table>

</div>

<div
id="ordersTab"
class="admin-section hidden">

<h2>

Orders

</h2>

<table class="admin-table">

<thead>

<tr>

<th>

Order

</th>

<th>

Customer

</th>

<th>

Status

</th>

<th>

Total

</th>

<th>

Actions

</th>

</tr>

</thead>

<tbody id="ordersTable">

</tbody>

</table>

</div>

<div
id="customersTab"
class="admin-section hidden">

<h2>

Customers

</h2>

<table class="admin-table">

<thead>

<tr>

<th>

Name

</th>

<th>

Email

</th>

<th>

Role

</th>

<th>

Joined

</th>

</tr>

</thead>

<tbody id="customersTable">

</tbody>

</table>

</div>

</section>

</div>

</section>

</main>

<footer class="site-footer">

<div class="container">

<p>

© 2026 DeskDesign3D

</p>

</div>

</footer>

<script
type="module"
src="assets/js/admin/admin.js">

</script>

<script type="module" src="assets/js/app.js"></script>

</body>

</html>
