<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | DeskDesign3D</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>

<body>

<header>
    <h1>Admin Panel</h1>
    <nav>
        <a href="index.html">Shop</a>
        <a href="admin.html" onclick="handleLogout(event)">Logout</a>
    </nav>
</header>

<div class="container">
    <!-- Message container for feedback -->
    <div id="messageContainer" aria-live="polite"></div>

    <h2>Add Product</h2>

    <div class="form-container">
        <input id="name" placeholder="Product name" type="text" maxlength="200">
        <input id="price" placeholder="Price (e.g. 9.99)" type="number" step="0.01" min="0" max="99999">
        <input id="image" placeholder="Image URL" type="url" maxlength="500">

        <button id="addProductBtn" onclick="addProduct()">Add Product</button>
    </div>

    <h2>Products</h2>

    <div id="productList"></div>
</div>

<style>
    #messageContainer {
        margin-top: 20px;
    }

    .message {
        padding: 12px 16px;
        border-radius: 8px;
        margin-bottom: 15px;
        font-weight: 500;
        animation: slideIn 0.3s ease-out;
    }

    .message-error {
        background: #fee;
        color: #c00;
        border-left: 4px solid #c00;
    }

    .message-success {
        background: #efe;
        color: #060;
        border-left: 4px solid #060;
    }

    .message-info {
        background: #eef;
        color: #006;
        border-left: 4px solid #006;
    }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(-10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .delete-btn {
        background: #d00;
        margin-top: 10px;
    }

    .delete-btn:hover {
        background: #b00;
    }

    .error {
        color: #c00;
        padding: 15px;
        background: #fee;
        border-radius: 8px;
    }
</style>

<script src="admin.js"></script>

<script>
    // Check admin access on page load
    async function checkAdmin() {
        try {
            const { data: { user } } = await supabase.auth.getUser();

            if (!user) {
                console.error("No user logged in");
                window.location.href = "login.html";
                return;
            }

            const { data: profile, error } = await supabase
                .from("profiles")
                .select("role")
                .eq("id", user.id)
                .single();

            if (error) {
                console.error("Error fetching profile:", error.message);
                window.location.href = "login.html";
                return;
            }

            if (!profile || profile.role !== "admin") {
                console.error("User is not an admin");
                window.location.href = "index.html";
                return;
            }
        } catch (err) {
            console.error("Unexpected error checking admin:", err.message);
            window.location.href = "login.html";
        }
    }

    // Handle logout
    function handleLogout(event) {
        event.preventDefault();
        supabase.auth.signOut().then(() => {
            window.location.href = "login.html";
        }).catch(err => {
            console.error("Logout error:", err);
            window.location.href = "login.html";
        });
    }

    // Check admin on page load
    checkAdmin();
</script>

</body>
</html>
