<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Product | DeskDesign3D

</title>

<meta
name="description"
content="DeskDesign3D Product Details">

<link
rel="stylesheet"
href="assets/css/main.css">

<link
rel="stylesheet"
href="assets/css/layout.css">

<link
rel="stylesheet"
href="assets/css/components.css">

<link
rel="stylesheet"
href="assets/css/responsive.css">

</head>

<body
data-page="product">

<header class="site-header">

<div class="container">

<a
href="index.html"
class="logo">

<img
src="assets/images/logo/logo.png"
alt="DeskDesign3D">

</a>

<nav class="desktop-nav">

<a href="index.html">

Home

</a>

<a href="products.html">

Products

</a>

<a href="cart.html">

Cart

</a>

<a
href="login.html"
id="loginButton">

Login

</a>

<button
id="accountButton"
class="hidden">

Account

</button>

</nav>

</div>

</header>

<main>

<section class="container mt-2">

<div class="product-page">

<div class="product-gallery">

<img

id="mainImage"

src="assets/images/placeholder.png"

alt="Product">

<div

id="thumbnailContainer"

class="thumbnail-grid">

</div>

</div>

<div class="product-information">

<h1
id="productName">

Loading...

</h1>

<p
class="price"
id="productPrice">

€0.00

</p>

<p
id="productStock">

Checking stock...

</p>

<p
id="productDescription">

Loading description...

</p>

<div class="quantity-selector">

<button
id="decreaseQuantity">

-

</button>

<input

type="number"

id="quantity"

value="1"

min="1">

<button
id="increaseQuantity">

+

</button>

</div>

<div class="product-actions">

<button

id="addToCart"

class="primary-button">

Add To Cart

</button>

<button

id="favoriteButton"

class="secondary-button">

♡ Favorite

</button>

</div>

<hr>

<h3>

Specifications

</h3>

<table class="table">

<tr>

<td>

Category

</td>

<td
id="productCategory">

-

</td>

</tr>

<tr>

<td>

Material

</td>

<td
id="productMaterial">

PLA

</td>

</tr>

<tr>

<td>

Brand

</td>

<td>

DeskDesign3D

</td>

</tr>

</table>

</div>

</div>

</section>

<section class="container mt-2">

<h2>

Customer Reviews

</h2>

<div
id="reviewsContainer">

</div>

</section>
