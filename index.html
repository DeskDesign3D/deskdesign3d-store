<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeskDesign3D</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>

<body>

<header>
    <h1>DeskDesign3D</h1>
    <p>3D Printed Desk Accessories</p>

    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="checkout.html">Checkout</a>
    </nav>
</header>

<main class="container">

    <h2>Products</h2>

    <div id="productGrid" class="grid"></div>

    <h2>Your Cart</h2>

    <div class="cart">

        <ul id="cartList"></ul>

        <h3>
            Total:
            €<span id="total">0.00</span>
        </h3>

        <button id="checkoutBtn" onclick="checkout()">
            Checkout
        </button>

    </div>

</main>

<footer>
    <p>© 2026 DeskDesign3D</p>
</footer>

<style>
    .error {
        color: #c00;
        padding: 15px;
        background: #fee;
        border-radius: 8px;
        margin: 15px 0;
    }

    .cart-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid #eee;
    }

    .remove-btn {
        background: #d00;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
    }

    .remove-btn:hover {
        background: #b00;
    }

    #checkoutBtn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .card img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        border-radius: 10px;
        margin-bottom: 15px;
    }
</style>

<script src="app.js"></script>

</body>
</html>
