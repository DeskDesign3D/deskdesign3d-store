<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeskDesign3D</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f5f5f5;
}

header {
  background: #111;
  color: white;
  padding: 20px;
  text-align: center;
}

.container {
  padding: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
}

.price {
  font-weight: bold;
  margin-top: 10px;
}

button {
  margin-top: 10px;
  padding: 10px;
  width: 100%;
  background: black;
  color: white;
  border: none;
  border-radius: 6px;
}

button:hover {
  background: #333;
}

.cart {
  background: white;
  padding: 15px;
  margin: 20px;
  border-radius: 10px;
}
</style>
</head>

<body>

<header>
  <h1>DeskDesign3D</h1>
  <p>3D printed desk accessories</p>
</header>

<div class="container">

<h2>Products</h2>

<div class="grid">

  <div class="card">
    <h3>Desk Cable Organizer</h3>
    <p>Clean desk cables</p>
    <div class="price">€1.00</div>
    <button onclick="addToCart('Cable Organizer')">Buy</button>
  </div>

  <div class="card">
    <h3>Headphone Stand</h3>
    <p>Hold your headphones</p>
    <div class="price">€1.00</div>
    <button onclick="addToCart('Headphone Stand')">Buy</button>
  </div>

  <div class="card">
    <h3>Pen Holder</h3>
    <p>Simple desk organizer</p>
    <div class="price">€1.00</div>
    <button onclick="addToCart('Pen Holder')">Buy</button>
  </div>

</div>

<h2>Your Cart</h2>

<div class="cart">
  <ul id="cartList"></ul>
  <p><b>Total:</b> €<span id="total">0</span></p>
</div>

</div>

<script>
let cart = [];
let total = 0;

function addToCart(item) {
  cart.push({
    name: item,
    price: 1
  });

  total += 1;
  updateCart();
}

function updateCart() {
  const list = document.getElementById("cartList");
  list.innerHTML = "";

  cart.forEach((item) => {
    const li = document.createElement("li");
    li.textContent = `${item.name} - €${item.price}`;
    list.appendChild(li);
  });

  document.getElementById("total").innerText = total;
}

// 🔥 BELANGRIJK: echte totaalberekening voor Supabase checkout
function getTotalPrice() {
  return cart.reduce((sum, item) => sum + item.price, 0);
}

// 🧾 CLEAR CART na bestelling
function clearCart() {
  cart = [];
  total = 0;
  updateCart();
}
</script>

</body>
</html>
